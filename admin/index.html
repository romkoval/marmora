<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>LEVONI · Админка</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="specification.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">К рабочей области</a>
  <header class="topbar">
    <div class="identity">
      <button class="icon-btn menu-toggle" type="button" data-action="menu" aria-label="Меню" aria-controls="sidebar" aria-expanded="false">☰</button>
      <a class="wordmark" href="#leads" aria-label="LEVONI, заявки"><img src="assets/levoni-brand.png" width="676" height="120" alt="LEVONI"></a>
      <span class="workspace-name">Админка</span>
      <span class="demo-label">Демо</span>
    </div>
    <div class="topbar-tools">
      <span class="location"><span class="location-dot" aria-hidden="true"></span>Москва и область</span>
      <label class="role-select">
        <span class="sr-only">Роль в макете</span>
        <select id="role">
          <option value="leadership">Руководитель</option>
          <option value="manager">Менеджер</option>
          <option value="catalog">Администратор каталога</option>
          <option value="accounting">Бухгалтерия</option>
        </select>
      </label>
      <span class="avatar" id="avatar" aria-hidden="true">АВ</span>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <nav id="navigation" aria-label="Разделы админки"></nav>
      <div class="sidebar-footer"><span class="status-dot" aria-hidden="true"></span>Демонстрационный контур</div>
    </aside>
    <main class="workspace" id="workspace" tabindex="-1"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="notification" class="notification" role="status" aria-live="polite"></div>
</body>
</html>
