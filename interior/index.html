    button,a{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    [hidden]{display:none!important}
    .defs{position:absolute;width:0;height:0;overflow:hidden}
    .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .layout{max-width:1570px;margin:auto;padding:clamp(16px,3.5vh,46px) clamp(18px,3.5vw,65px);min-height:100svh;display:grid;align-content:center}
    .viewer{display:grid;grid-template-columns:minmax(0,1fr) clamp(310px,27vw,390px);margin:auto;width:min(100%,calc(92svh + clamp(310px,27vw,390px)));background:var(--panel);box-shadow:0 15px 58px -29px #242b2538}
    @media(min-width:801px){.shop-interior{background:var(--panel)}.shop-interior .layout{max-width:none;padding:0}.shop-interior .viewer{box-shadow:none;width:min(100%,calc(100svh + clamp(310px,27vw,390px)))}}
    .stage{aspect-ratio:1;position:relative;isolation:isolate;min-width:0;overflow:hidden;background:#302e2a;align-self:start}
    .photo-frame{position:absolute;width:var(--photo-size,100%);aspect-ratio:1;top:50%;left:50%;transform:translate(-50%,-50%)}
    .opening-decor .photo-frame{visibility:hidden}
    .opening-decor .stage::before{content:"Загружаем интерьер…";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px}
    .surface-choice.from-card .target-name{color:var(--accent);font-weight:750}
    .shop-interior .surface-choice.from-card>img{outline:2px solid var(--accent);outline-offset:1px}
    .poster,.surface,.surface canvas{display:block;width:100%;height:100%}
    .poster,.surface,.finish-layer{position:absolute;inset:0}
    .poster,.finish-layer{user-select:none;pointer-events:none}
    .finish-layer{inset:auto;display:block}
    .surface canvas{touch-action:none;cursor:grab}
    .surface canvas:active{cursor:grabbing}
    .stage:fullscreen,.stage.expanded{background:#21241f;width:100%;height:100%;aspect-ratio:auto}
    .stage.expanded{position:fixed;inset:0;z-index:8}
    .stagebar{position:absolute;right:15px;bottom:15px;display:flex;gap:6px;align-items:center}
    .tool{width:39px;height:39px;border:1px solid #ffffff60;border-radius:50%;background:#262920c7;color:white;display:grid;place-items:center;backdrop-filter:blur(7px)}
    .tool:hover{background:#252a22}.tool .icon{width:17px;height:17px}
    .message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:5px;background:#272d24e8;color:#fff;padding:12px 18px;text-align:center;font-size:14px;pointer-events:none}
    .side{position:relative;min-width:0;min-height:0}
    .overview,.picker{position:absolute;inset:0;padding:clamp(20px,2.5vw,36px);min-height:0;display:flex;flex-direction:column}
    .overview{overflow:auto;scrollbar-width:thin}
    .signature{display:flex;align-items:center;gap:9px;font-size:13px;line-height:1;letter-spacing:.16em;font-weight:800}
    .signature svg{height:21px;width:21px;stroke-width:1.35}
    h1{margin:clamp(18px,3.7vh,38px) 0 20px;font-size:clamp(32px,3.05vw,49px);letter-spacing:-.064em;font-weight:560;line-height:1.04}
    h2{font-size:15px;letter-spacing:-.025em;margin:0;font-weight:700}
    .modes{display:flex;background:var(--segment);padding:3px;border-radius:6px;gap:2px}
    .modes button{border:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:37px;border-radius:4px;flex:1;background:transparent;color:var(--ink);font-weight:650;font-size:12px;white-space:nowrap}
    .modes button[aria-pressed=true]{background:var(--accent);color:#fff}
    .modes .icon{width:16px;height:16px}
    .hint{font-size:12px;line-height:1.45;color:var(--muted);margin:8px 0 0}
    .finish-controls,.camera-list{margin-top:clamp(18px,3.7vh,37px)}
    .section-head{display:flex;align-items:center;justify-content:space-between;min-height:25px;margin-bottom:7px}
    .quiet{background:none;border:0;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 0}
    .quiet:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
    .quiet .icon{width:15px;height:15px}
    .surface-choice{width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:48px minmax(0,1fr) 15px;align-items:center;gap:12px;text-align:left}
    .surface-choice:last-child{border-bottom:1px solid var(--line)}
    .surface-choice:hover .chosen-name{color:var(--accent)}
    .surface-choice>img,.sample-image{background:#dbd9ce;box-shadow:inset 0 0 0 1px #282d2520}
    .surface-choice>img{display:block;width:48px;height:37px;object-fit:cover;border-radius:3px;border:1px solid #282d251e}
    .surface-choice>span{min-width:0}
    .target-name{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:560;line-height:1.4}
    .target-name .icon{width:13px;height:13px}
    .chosen-value{display:flex;align-items:baseline;gap:7px;min-width:0}
    .chosen-name{display:block;font-size:14px;line-height:1.35;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .chosen-code{color:var(--muted);flex:none;font-size:10px;font-weight:550;white-space:nowrap}
    .arrow{width:15px;height:15px;color:#6b7366}
    .camera-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .camera-list h2{grid-column:1/-1;margin-bottom:3px}
    .view{margin:0;padding:0 0 7px;border:0;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:transparent;font-size:11px;line-height:1.3}
    .view img{width:100%;aspect-ratio:1.7;object-fit:cover;border-radius:2px}
    .view[aria-pressed=true]{border-bottom-color:var(--accent);font-weight:750}
    .view:hover{color:var(--accent)}
    .bottom{margin-top:auto;padding-top:clamp(18px,3vh,38px)}
    .download{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:650;font-size:12px}
    .download:hover{text-decoration:underline;text-underline-offset:4px}
    .download .icon{width:16px;height:16px}
    .picker{overflow:hidden}
    .picker-top{display:flex;align-items:center;justify-content:space-between;min-height:28px}
    .back{display:inline-flex;gap:8px;align-items:center;border:0;background:transparent;padding:4px 0;color:var(--muted);font-size:12px;font-weight:650}
    .back .icon{width:16px;height:16px;transform:rotate(180deg)}
    .picker-count{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
    .picker h2{margin:17px 0 13px;font-size:clamp(24px,2.35vw,34px);line-height:1.1;letter-spacing:-.052em;font-weight:590}
    .search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 10px;flex:none}
    .search-box:focus-within{outline:2px solid var(--focus);outline-offset:1px}
    .search-box .icon{width:16px;height:16px;color:var(--muted)}
    .search-box input{background:none;border:0;color:var(--ink);width:100%;min-width:0;font:inherit;font-size:12px;padding:10px 0;outline:0}
    .link-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:650;margin:12px 0 0}
    .link-label input{accent-color:var(--accent);margin:0;width:16px;height:16px}
    .catalog-scroll{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;margin:15px -5px 0;padding:2px 5px 6px;min-height:0}
    .catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 10px}
    .sample{background:none;border:0;text-align:left;padding:2px;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:0;color:var(--ink)}
    .sample-image{display:block;position:relative;border-radius:3px;overflow:hidden;border:1px solid #363c2e26;aspect-ratio:2.05}
    .sample-image img{display:block;width:100%;height:100%;object-fit:cover}
    .sample-check{display:none;position:absolute;right:5px;bottom:5px;background:var(--accent);color:white;border:1px solid #ffffffad;border-radius:50%;padding:2px;width:18px;height:18px}
    .sample[aria-pressed=true] .sample-check{display:block}
    .sample[aria-pressed=true] .sample-image{outline:2px solid var(--accent);outline-offset:1px}
    .sample:hover .sample-image{border-color:var(--accent)}
    .sample-name{font-weight:700;font-size:12px;line-height:1.35;margin-top:6px}
    .sample-code{color:var(--muted);font-size:10px;line-height:1.4;margin-top:1px}
    .empty{font-size:13px;color:var(--muted);margin:8px 0}
    @media(max-width:800px){
      .layout{min-height:auto;padding:0;max-width:660px}
      .viewer{display:flex;flex-direction:column;width:100%;box-shadow:none}
      .stage{width:100%;align-self:center}
      .overview,.picker{position:static;padding:20px clamp(18px,4vw,32px) 26px}
      .signature{font-size:11px;gap:6px}.signature svg{width:17px;height:17px}
      h1{font-size:clamp(31px,6vw,42px);margin:12px 0 14px}
      .modes{max-width:360px}
      .finish-controls,.camera-list{margin-top:21px}
      .surface-choice{padding:8px 0}
      .view{font-size:12px}.view img{aspect-ratio:2.1}
      .bottom{padding-top:20px}.stagebar{bottom:11px;right:11px}
      body.choosing .viewer{height:100svh}
      body.choosing .stage:not(:fullscreen):not(.expanded){height:min(42svh,100vw);aspect-ratio:auto;flex:none}
      body.choosing .side{flex:1;min-height:0}
      .picker{height:100%;padding-top:10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
      .picker h2{font-size:24px;margin:6px 0 10px}
      .catalog-scroll{margin-top:9px}
      .catalog-grid{grid-template-columns:repeat(auto-fit,minmax(min(125px,42%),1fr));gap:10px}
    }
    @media(max-width:380px){.view{font-size:11px}.tool{width:36px;height:36px}}
    @media(max-width:800px) and (max-height:570px){body.choosing .stage:not(:fullscreen):not(.expanded){height:26svh}.picker h2{font-size:20px}.search-box input{padding:7px 0}}
  </style>
</head>
